<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>S.AI Login</title>
    <style>
      :root {
        --bg: #f6f8fa;
        --panel: rgba(255, 255, 255, 0.84);
        --text: #0f1722;
        --muted: #7d8796;
        --accent: #14b8a6;
        --border: rgba(107, 114, 128, 0.08);
        --shadow: 0 20px 44px rgba(15, 23, 42, 0.06);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 15px;
        background:
          radial-gradient(circle at top left, rgba(20, 184, 166, 0.05), transparent 26%),
          radial-gradient(circle at bottom right, rgba(20, 184, 166, 0.03), transparent 22%),
          var(--bg);
        color: var(--text);
      }

      .panel {
        width: min(100%, 360px);
        padding: 28px;
        border-radius: 24px;
        background: var(--panel);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        backdrop-filter: blur(14px);
      }

      .eyebrow {
        font-size: 12px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 600;
      }

      h1 {
        margin: 10px 0 8px;
        font-size: 30px;
        letter-spacing: -0.04em;
        font-weight: 640;
      }

      .sub {
        margin: 0 0 22px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.45;
      }

      .stack {
        display: grid;
        gap: 12px;
      }

      label {
        display: grid;
        gap: 6px;
      }

      .label {
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 560;
      }

      input {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 11px 12px;
        font: inherit;
        font-size: 15px;
        background: rgba(255, 255, 255, 0.8);
        color: var(--text);
        outline: none;
      }

      button {
        margin-top: 6px;
        border: 0;
        border-radius: 14px;
        padding: 11px 14px;
        font: inherit;
        font-size: 15px;
        font-weight: 580;
        background: linear-gradient(180deg, #22c5b3, var(--accent));
        color: #041513;
        cursor: pointer;
      }

      .error {
        min-height: 18px;
        margin-top: 12px;
        color: #dc5f55;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <form class="panel" id="loginForm">
      <div class="eyebrow">S.AI</div>
      <h1>Login</h1>
      <p class="sub">Введите логин и пароль, чтобы открыть панель управления.</p>

      <div class="stack">
        <label>
          <span class="label">Login</span>
          <input id="login" name="login" autocomplete="username" />
        </label>
        <label>
          <span class="label">Password</span>
          <input id="password" name="password" type="password" autocomplete="current-password" />
        </label>
      </div>

      <button type="submit">Войти</button>
      <div id="error" class="error"></div>
    </form>

    <script>
      const form = document.getElementById('loginForm');
      const errorNode = document.getElementById('error');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        errorNode.textContent = '';

        const response = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            login: document.getElementById('login').value,
            password: document.getElementById('password').value,
          }),
        });

        if (response.ok) {
          window.location.href = '/';
          return;
        }

        errorNode.textContent = 'Неверный логин или пароль.';
      });
    </script>
  </body>
</html>
