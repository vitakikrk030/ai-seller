<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S.AI</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      background: #a9aaa8;
      color: #111;
      --control-height: 42px;
      --panel-control-gap: 12px;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      background: #b4b5b2;
    }

    .shell {
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-columns: clamp(52px, 4.5vw, 58px) minmax(0, 1fr);
      gap: clamp(12px, 1.5vw, 18px);
      padding: clamp(14px, 1.6vw, 22px);
      color: #111;
    }

    .rail {
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      padding: 0;
      min-height: 0;
    }

    .rail-inner {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 14px 0;
      width: clamp(52px, 4.5vw, 58px);
      border-radius: 18px;
      background: #171717;
      color: #f8f8f8;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
    }

    .logo {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      color: #f7f7f7;
      font-size: 11px;
      font-weight: 780;
      letter-spacing: 0;
      line-height: 1;
    }

    .rail-icon {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: #f4f4f4;
      font-size: 20px;
    }

    .rail-icon svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .rail-icon.active {
      background: linear-gradient(180deg, #777, #4b4b4b);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.22);
    }

    .rail-spacer { flex: 1; }

    .main {
      min-width: 0;
      min-height: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      backdrop-filter: none;
      overflow: auto;
      padding: clamp(18px, 2.4vw, 34px);
    }

    .connect-grid {
      width: min(1180px, 100%);
      min-height: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: minmax(340px, 460px) minmax(460px, 1fr);
      grid-template-rows: auto auto auto minmax(0, 1fr);
      grid-template-areas:
        "telegram test"
        "ai test"
        "database test"
        "logs test";
      gap: clamp(18px, 2vw, 26px);
      align-items: stretch;
    }

    .panel {
      display: block;
      width: 100%;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      padding: 0;
      min-width: 0;
      min-height: 0;
    }

    .panel.active { display: block; }

    .panel.wide { grid-column: 1 / -1; }

    #telegram { grid-area: telegram; }
    #ai { grid-area: ai; }
    #database { grid-area: database; }
    #logs {
      grid-area: logs;
      display: flex;
      flex-direction: column;
    }
    #test {
      grid-area: test;
      display: flex;
      flex-direction: column;
    }

    h2 {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 12px;
      font-size: clamp(19px, 1.8vw, 23px);
      line-height: 1.1;
      font-weight: 720;
      letter-spacing: 0;
    }

    .panel-toggle {
      width: max-content;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 0;
      padding: 0;
      background: transparent;
      color: #111;
      font: inherit;
      cursor: pointer;
      text-align: left;
    }

    .panel-toggle h2 {
      margin: 0;
    }

    .chevron {
      color: rgba(20,20,20,.42);
      font-size: 15px;
      line-height: 1;
      transform: rotate(-90deg);
      transition: transform .18s ease;
    }

    .panel.expanded .chevron {
      transform: rotate(0deg);
    }

    .panel-body {
      display: none;
      margin-top: 12px;
    }

    .panel.expanded .panel-body {
      display: block;
    }

    .node-light {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #b84a4a;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.35),
        0 0 0 5px rgba(184,74,74,.1);
    }

    .node-light.on {
      background: #3aa65a;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.38),
        0 0 0 5px rgba(58,166,90,.12);
    }

    .mini-action {
      margin-left: auto;
      border: 0;
      border-radius: 999px;
      background: rgba(241, 243, 240, .72);
      color: rgba(20,20,20,.62);
      padding: 6px 10px;
      font: inherit;
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
      box-shadow: inset 0 0 0 1px rgba(20,20,20,.08);
    }

    .form {
      display: grid;
      gap: 12px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    label {
      color: rgba(20,20,20,.55);
      font-size: 12px;
      font-weight: 560;
    }

    input,
    select {
      width: 100%;
      height: 42px;
      min-width: 0;
      border: 1px solid rgba(20,20,20,.12);
      border-radius: 12px;
      background: rgba(238, 239, 237, .82);
      color: #111;
      padding: 0 14px;
      font: inherit;
      font-size: 16px;
      outline: none;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.5);
    }

    input:focus,
    select:focus {
      border-color: rgba(20,20,20,.25);
      background: rgba(248, 249, 247, .82);
    }

    .readout {
      min-height: 42px;
      display: flex;
      align-items: center;
      padding: 0 14px;
      border: 1px solid rgba(20,20,20,.08);
      border-radius: 12px;
      background: rgba(238, 239, 237, .72);
      color: rgba(20,20,20,.72);
      font-size: 16px;
      word-break: break-word;
    }

    .model-row,
    .test-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: end;
      min-height: var(--control-height);
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: var(--panel-control-gap);
      min-height: var(--control-height);
    }

    button.action {
      min-height: var(--control-height);
      padding: 0 18px;
      border: 0;
      border-radius: 12px;
      background: #171717;
      color: #fff;
      font: inherit;
      font-size: 15px;
      font-weight: 620;
      cursor: pointer;
      box-shadow: 0 12px 24px rgba(0,0,0,.16);
    }

    button.action.secondary {
      background: rgba(241, 243, 240, .72);
      color: #151515;
      box-shadow: inset 0 0 0 1px rgba(20,20,20,.1);
    }

    #logs .actions {
      grid-template-columns: 1fr auto;
    }

    #clearLogs {
      background: #171717;
      color: #fff;
      box-shadow: 0 12px 24px rgba(0,0,0,.16);
    }

    .logs-box {
      flex: 1;
      height: auto;
      min-height: 110px;
      overflow: auto;
      border: 1px solid rgba(20,20,20,.08);
      border-radius: 14px;
      background: rgba(238, 239, 237, .72);
      padding: 14px;
      color: rgba(20,20,20,.74);
      font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .db-box {
      display: grid;
      gap: 8px;
      padding: 12px 14px;
      border: 1px solid rgba(20,20,20,.08);
      border-radius: 14px;
      background: rgba(238, 239, 237, .72);
      color: rgba(20,20,20,.72);
      font-size: 13px;
    }

    .db-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
    }

    .db-row strong {
      color: #111;
      font-weight: 720;
    }

    .db-muted {
      color: rgba(20,20,20,.45);
    }

    .chat-shell {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-rows: minmax(0, 1fr) var(--control-height);
      gap: var(--panel-control-gap);
    }

    .chat-box {
      min-height: 0;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border: 1px solid rgba(20,20,20,.08);
      border-radius: 14px;
      background: rgba(238, 239, 237, .72);
      padding: 14px;
    }

    .empty-chat {
      margin: auto;
      color: rgba(20,20,20,.42);
      font-size: 14px;
      text-align: center;
    }

    .bubble {
      width: fit-content;
      max-width: min(78%, 560px);
      padding: 10px 12px;
      border-radius: 16px;
      line-height: 1.42;
      font-size: 15px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .bubble-head {
      display: flex;
      align-items: center;
      margin-bottom: 6px;
      line-height: 1;
    }

    .bubble-avatar {
      width: 20px;
      height: 20px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 760;
      letter-spacing: 0;
      user-select: none;
    }

    .bubble.user {
      align-self: flex-end;
      background: rgba(224, 238, 229, .92);
      border-bottom-right-radius: 5px;
    }

    .bubble.user .bubble-head {
      justify-content: flex-end;
    }

    .bubble.user .bubble-avatar {
      background: rgba(26, 94, 50, .12);
      color: #235d37;
      box-shadow: inset 0 0 0 1px rgba(26, 94, 50, .14);
    }

    .bubble.ai {
      align-self: flex-start;
      background: rgba(255,255,255,.62);
      box-shadow: inset 0 0 0 1px rgba(20,20,20,.08);
      border-bottom-left-radius: 5px;
    }

    .bubble.ai .bubble-avatar {
      background: #171717;
      color: #fff;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.18);
    }

    .bubble-meta {
      margin-top: 6px;
      color: rgba(20,20,20,.34);
      font-size: 10px;
      line-height: 1;
      text-align: right;
    }

    .bubble.pending {
      color: rgba(20,20,20,.45);
    }

    @media (max-width: 980px) {
      body { overflow: auto; }
      .shell {
        height: auto;
        min-height: 100vh;
        grid-template-columns: 58px minmax(0, 1fr);
        padding: 16px;
      }
      .connect-grid {
        min-height: 0;
        grid-template-columns: 1fr;
        grid-template-rows: auto;
        grid-template-areas:
          "telegram"
          "ai"
          "database"
          "logs"
          "test";
      }
      .logs-box { height: 280px; }
      #logs { display: block; }
      .chat-shell { grid-template-rows: 280px auto; }
    }

    @media (min-width: 981px) and (max-height: 760px) {
      .shell {
        padding: 14px;
        gap: 14px;
      }
      .main {
        padding: 18px 22px;
      }
      .connect-grid {
        gap: 14px 22px;
      }
      h2 {
        margin-bottom: 8px;
        font-size: 19px;
      }
      .form {
        gap: 9px;
      }
      input,
      select {
        height: 38px;
      }
      .readout {
        min-height: 38px;
      }
      .actions {
        margin-top: 10px;
        min-height: 38px;
      }
      button.action {
        min-height: 38px;
        height: 38px;
      }
      .logs-box {
        height: 92px;
        min-height: 92px;
      }
      .chat-shell {
        grid-template-rows: minmax(0, 1fr) 38px;
        gap: 10px;
      }
      .test-row { min-height: 38px; }
    }

    @media (max-width: 640px) {
      body { overflow: auto; }
      .shell {
        width: 100%;
        height: auto;
        min-height: 100vh;
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
        gap: 14px;
        padding: 12px;
      }
      .rail {
        position: sticky;
        top: 0;
        z-index: 5;
      }
      .rail-inner {
        width: 100%;
        height: 54px;
        flex-direction: row;
        justify-content: flex-start;
        padding: 0 10px;
        border-radius: 16px;
      }
      .rail-spacer { display: none; }
      .main {
        overflow: visible;
        padding: 8px 2px 24px;
      }
      .connect-grid {
        width: 100%;
        gap: 24px;
      }
      .model-row,
      .test-row {
        grid-template-columns: 1fr;
      }
      .actions {
        margin-top: 14px;
      }
      #telegram .actions,
      #ai .actions,
      .actions {
        grid-template-columns: 1fr;
      }
      button.action {
        width: 100%;
      }
      .logs-box {
        height: 260px;
      }
      #logs { display: block; }
      .chat-shell {
        grid-template-rows: 260px auto;
      }
    }

    @media (max-width: 380px) {
      .shell { padding: 10px; }
      input,
      select,
      .readout {
        font-size: 15px;
        padding: 0 12px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <aside class="rail" aria-label="Навигация">
      <div class="rail-inner">
        <div class="logo">S.AI</div>
        <button class="rail-icon active" type="button" aria-label="Соединение" title="Соединение">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8.5 12h7"></path>
            <path d="M9.8 7.2 6.9 4.3a4 4 0 0 0-5.6 5.6l2.8 2.8a4 4 0 0 0 5.6 0"></path>
            <path d="m14.2 16.8 2.9 2.9a4 4 0 0 0 5.6-5.6l-2.8-2.8a4 4 0 0 0-5.6 0"></path>
          </svg>
        </button>
        <div class="rail-spacer"></div>
      </div>
    </aside>

    <section class="main">
      <div class="connect-grid">
      <section class="panel collapsible" id="telegram">
        <button class="panel-toggle" type="button" data-toggle-panel="telegram" aria-expanded="false">
          <h2>Telegram <span class="node-light" id="telegramStatusLight" aria-label="Telegram не настроен"></span></h2>
          <span class="chevron">⌄</span>
        </button>
        <div class="panel-body">
        <div class="form">
          <div class="field">
            <label>Токен Telegram</label>
            <input id="telegram_token" placeholder="загрузка">
          </div>
          <div class="field">
            <label>Webhook</label>
            <input id="webhook_url">
          </div>
        </div>
        <div class="actions">
          <button class="action" id="saveTelegram">Сохранить</button>
        </div>
        </div>
      </section>

      <section class="panel" id="test">
        <h2>Тест-чат <button class="mini-action" id="clearTestChat" type="button">Очистить</button></h2>
        <div class="chat-shell">
          <div class="chat-box" id="chatBox">
            <div class="empty-chat" id="emptyChat">Введите сообщение ниже, чтобы проверить ответ модели.</div>
          </div>
          <div class="test-row">
            <input id="testInput" placeholder="Введите сообщение">
            <button class="action" id="sendTest">Отправить</button>
          </div>
        </div>
      </section>

      <section class="panel collapsible" id="ai">
        <button class="panel-toggle" type="button" data-toggle-panel="ai" aria-expanded="false">
          <h2>AI-модель <span class="node-light" id="aiStatusLight" aria-label="AI не настроен"></span></h2>
          <span class="chevron">⌄</span>
        </button>
        <div class="panel-body">
        <div class="form">
          <div class="field">
            <label>Ключ AI</label>
            <input id="ai_key" placeholder="загрузка">
          </div>
          <div class="field">
            <label>Базовый URL</label>
            <input id="ai_url">
          </div>
          <div class="field">
            <label>Модель</label>
            <div class="model-row">
              <select id="model"></select>
              <button class="action secondary" id="loadModels" type="button">Загрузить</button>
            </div>
          </div>
        </div>
        <div class="actions">
          <button class="action" id="saveAi">Сохранить</button>
        </div>
        </div>
      </section>

      <section class="panel" id="database">
        <h2>База <span class="node-light" id="databaseStatusLight" aria-label="База не настроена"></span></h2>
        <div class="db-box" id="databaseBox">Загрузка...</div>
      </section>

      <section class="panel" id="logs">
        <h2>Логи</h2>
        <div class="logs-box" id="logsBox">Загрузка...</div>
        <div class="actions">
          <button class="action secondary" id="refreshLogs">Обновить</button>
          <button class="action secondary" id="clearLogs">Очистить</button>
        </div>
      </section>
      </div>
    </section>
  </main>

  <script>
    const chatBox = document.getElementById('chatBox');
    const secretFields = ['telegram_token', 'ai_key'];
    const testChatStorageKey = 'sai:test-chat:v1';
    const testHistory = [];
    let currentModel = '';

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;',
      }[char]));
    }

    function setModelOptions(models, selected) {
      const select = document.getElementById('model');
      const value = selected || currentModel || '';
      const unique = Array.from(new Set([value, ...models].filter(Boolean)));
      select.innerHTML = unique.length
        ? unique.map((model) => `<option value="${escapeHtml(model)}">${escapeHtml(model)}</option>`).join('')
        : '<option value="">модель не выбрана</option>';
      select.value = value;
    }

    async function loadStatus() {
      const response = await fetch('/config/status');
      const data = await response.json();
      const cfg = data.config || {};
      document.getElementById('webhook_url').value = cfg.webhook_url || '';
      document.getElementById('ai_url').value = cfg.ai_url || '';
      currentModel = cfg.model || '';
      setModelOptions([], currentModel);
      const telegramInput = document.getElementById('telegram_token');
      const aiKeyInput = document.getElementById('ai_key');
      telegramInput.value = cfg.telegram_token_set ? cfg.telegram_token_preview : '';
      telegramInput.dataset.preview = cfg.telegram_token_set ? cfg.telegram_token_preview : '';
      telegramInput.placeholder = cfg.telegram_token_set ? 'очистите и сохраните, чтобы удалить' : 'вставьте токен Telegram';
      aiKeyInput.value = cfg.ai_key_set ? cfg.ai_key_preview : '';
      aiKeyInput.dataset.preview = cfg.ai_key_set ? cfg.ai_key_preview : '';
      aiKeyInput.placeholder = cfg.ai_key_set ? 'очистите и сохраните, чтобы удалить' : 'вставьте ключ AI';
      setStatusLight('telegramStatusLight', cfg.telegram_token_set, 'Telegram');
      setStatusLight('aiStatusLight', cfg.ai_key_set && Boolean(cfg.ai_url) && Boolean(cfg.model), 'AI');
    }

    function setStatusLight(id, isOn, label) {
      const light = document.getElementById(id);
      if (!light) return;
      light.classList.toggle('on', Boolean(isOn));
      light.setAttribute('aria-label', `${label}: ${isOn ? 'работает' : 'не настроен'}`);
      light.title = isOn ? 'Работает' : 'Не настроен';
    }

    async function loadModels() {
      const aiUrl = document.getElementById('ai_url').value.trim();
      const aiKey = document.getElementById('ai_key').value.trim();
      const params = new URLSearchParams();
      if (aiUrl) params.set('ai_url', aiUrl);
      if (aiKey) params.set('ai_key', aiKey);
      const response = await fetch(`/config/models?${params.toString()}`);
      const data = await response.json();
      if (!data.ok) {
        alert(data.error || 'Не удалось загрузить модели');
        return;
      }
      setModelOptions(data.models || [], document.getElementById('model').value || currentModel);
      await loadLogs();
    }

    async function saveConfig(keys) {
      const payload = {};
      for (const key of keys) {
        const input = document.getElementById(key);
        const value = input.value.trim();
        const preview = input.dataset.preview || '';
        if (secretFields.includes(key) && value && value === preview) continue;
        payload[key] = value;
      }
      await fetch('/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      await loadStatus();
      await loadLogs();
      await loadDatabaseStatus();
    }

    async function loadLogs() {
      const response = await fetch('/logs?limit=160');
      const data = await response.json();
      const logs = data.logs || [];
      document.getElementById('logsBox').textContent = logs.map((item) => JSON.stringify(item, null, 2)).join('\n\n') || 'Логов пока нет';
    }

    async function loadDatabaseStatus() {
      const response = await fetch('/db/status');
      const data = await response.json();
      const database = data.database || {};
      setStatusLight('databaseStatusLight', database.enabled && database.ready, 'База');
      const rows = Array.isArray(database.tables) ? database.tables : [];
      const state = !database.enabled
        ? 'DATABASE_URL не задан'
        : database.ready
          ? 'подключена'
          : `ошибка: ${database.error || 'нет соединения'}`;
      document.getElementById('databaseBox').innerHTML = `
        <div class="db-row"><span>Тип</span><strong>${escapeHtml(database.type || 'PostgreSQL')}</strong></div>
        <div class="db-row"><span>Статус</span><strong>${escapeHtml(state)}</strong></div>
        <div class="db-row"><span>Таблицы</span><span class="db-muted">${escapeHtml(rows.map((table) => `${table.name}${table.rows == null ? '' : `:${table.rows}`}`).join(' · ') || 'ожидают подключения')}</span></div>
      `;
    }

    function formatMessageTime(date = new Date()) {
      return new Intl.DateTimeFormat('ru-RU', {
        day: '2-digit',
        month: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
      }).format(date);
    }

    function readStoredTestChat() {
      try {
        const raw = localStorage.getItem(testChatStorageKey);
        if (!raw) return [];
        const messages = JSON.parse(raw);
        if (!Array.isArray(messages)) return [];
        return messages
          .filter((message) => (
            ['user', 'assistant'].includes(message.role)
            && typeof message.content === 'string'
          ))
          .slice(-20);
      } catch {
        return [];
      }
    }

    function writeStoredTestChat(messages) {
      localStorage.setItem(testChatStorageKey, JSON.stringify(messages.slice(-20)));
    }

    function restoreTestChat() {
      const storedMessages = readStoredTestChat();
      if (!storedMessages.length) return;
      testHistory.length = 0;
      chatBox.innerHTML = '';
      storedMessages.forEach((message) => {
        testHistory.push({ role: message.role, content: message.content });
        addBubble(message.role === 'assistant' ? 'ai' : 'user', message.content, '', message.meta || '');
      });
    }

    function addBubble(role, text, extraClass = '', metaText = '') {
      const empty = document.getElementById('emptyChat');
      if (empty) empty.remove();
      const item = document.createElement('div');
      item.className = `bubble ${role}${extraClass ? ` ${extraClass}` : ''}`;
      const headNode = document.createElement('div');
      headNode.className = 'bubble-head';
      const avatarNode = document.createElement('div');
      avatarNode.className = 'bubble-avatar';
      avatarNode.textContent = role === 'user' ? 'К' : 'AI';
      avatarNode.title = role === 'user' ? 'Клиент' : 'AI';
      avatarNode.setAttribute('aria-label', role === 'user' ? 'Клиент' : 'AI');
      headNode.appendChild(avatarNode);
      const textNode = document.createElement('div');
      textNode.className = 'bubble-text';
      textNode.textContent = text;
      const metaNode = document.createElement('div');
      metaNode.className = 'bubble-meta';
      metaNode.textContent = metaText || formatMessageTime();
      item.append(headNode, textNode, metaNode);
      chatBox.appendChild(item);
      chatBox.scrollTop = chatBox.scrollHeight;
      return item;
    }

    function updateBubble(item, text, metaText = '') {
      const textNode = item.querySelector('.bubble-text');
      const metaNode = item.querySelector('.bubble-meta');
      if (textNode) textNode.textContent = text;
      if (metaNode && metaText) metaNode.textContent = metaText;
    }

    function resetTestChat() {
      testHistory.length = 0;
      localStorage.removeItem(testChatStorageKey);
      chatBox.innerHTML = '<div class="empty-chat" id="emptyChat">Введите сообщение ниже, чтобы проверить ответ модели.</div>';
    }

    async function sendTest() {
      const input = document.getElementById('testInput');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      const startedAt = Date.now();
      addBubble('user', text, '', formatMessageTime(new Date(startedAt)));
      const pending = addBubble('ai', 'Печатает...', 'pending', formatMessageTime(new Date(startedAt)));
      try {
        const response = await fetch('/api/test-chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, history: testHistory }),
        });
        const data = await response.json();
        const reply = data.reply || data.error || 'Нет ответа';
        const elapsed = ((Date.now() - startedAt) / 1000).toFixed(1).replace('.', ',');
        pending.classList.remove('pending');
        updateBubble(pending, reply, `${formatMessageTime()} · ${elapsed} сек`);
        if (data.ok && data.reply) {
          testHistory.push({ role: 'user', content: text, meta: formatMessageTime(new Date(startedAt)) });
          testHistory.push({ role: 'assistant', content: reply, meta: `${formatMessageTime()} · ${elapsed} сек` });
          if (testHistory.length > 20) testHistory.splice(0, testHistory.length - 20);
          writeStoredTestChat(testHistory);
        }
        await loadLogs();
      } catch (error) {
        const elapsed = ((Date.now() - startedAt) / 1000).toFixed(1).replace('.', ',');
        pending.classList.remove('pending');
        updateBubble(pending, error.message, `${formatMessageTime()} · ${elapsed} сек`);
      }
    }

    document.getElementById('saveTelegram').onclick = () => saveConfig(['telegram_token', 'webhook_url']);
    document.getElementById('saveAi').onclick = () => saveConfig(['ai_key', 'ai_url', 'model']);
    document.getElementById('loadModels').onclick = loadModels;
    document.getElementById('refreshLogs').onclick = loadLogs;
    document.getElementById('clearLogs').onclick = async () => {
      await fetch('/logs', { method: 'DELETE' });
      await loadLogs();
    };
    document.getElementById('sendTest').onclick = sendTest;
    document.getElementById('clearTestChat').onclick = resetTestChat;
    document.getElementById('testInput').addEventListener('keydown', (event) => {
      if (event.key === 'Enter') sendTest();
    });
    document.querySelectorAll('[data-toggle-panel]').forEach((button) => {
      button.addEventListener('click', () => {
        const panel = document.getElementById(button.dataset.togglePanel);
        const nextState = !panel.classList.contains('expanded');
        panel.classList.toggle('expanded', nextState);
        button.setAttribute('aria-expanded', String(nextState));
      });
    });

    loadStatus();
    loadLogs();
    loadDatabaseStatus();
    restoreTestChat();
  </script>
</body>
</html>
